name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest numpy "zarr>=2.12,<4" numcodecs

      - name: Rust unit tests
        run: cargo test --workspace --offline || cargo test --workspace

      - name: Develop install
        run: pip install -e ".[zarr]"

      - name: Pytest
        run: pytest -q

      - name: CLI help
        run: win-to-zarr --help

      - name: Maturin build (linux wheel)
        if: matrix.python-version == '3.12'
        run: maturin build --release -o dist
